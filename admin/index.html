<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Studio admin - Maria Andriiuk</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>
(function(){
  function clean(){ if (/_token=/.test(location.hash)) { location.replace(location.pathname + '#/'); } }
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', function(user){ if (user) clean(); });
    window.netlifyIdentity.on('login', function(){ clean(); });
  }
})();
</script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
